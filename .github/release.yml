changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - github-actions
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Tests
      labels:
        - test
        - tests
    - title: CI And Release
      labels:
        - ci
        - release
    - title: Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
